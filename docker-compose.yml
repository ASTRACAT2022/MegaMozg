services:
  meza-core:
    build:
      context: .
      dockerfile: apps/meza-core/Dockerfile
    env_file:
      - .env
    ports:
      - "${MEZA_CORE_HOST_PORT:-8080}:8080"
    volumes:
      - meza_core_data:/data
    restart: unless-stopped

  meza-panel:
    build:
      context: .
      dockerfile: apps/meza-panel/Dockerfile
    env_file:
      - .env
    depends_on:
      - meza-core
    expose:
      - "3000"
    restart: unless-stopped

  meza-panel-ssl:
    image: caddy:2-alpine
    env_file:
      - .env
    depends_on:
      - meza-panel
    ports:
      - "1499:1499"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  meza_core_data:
  caddy_data:
  caddy_config:
